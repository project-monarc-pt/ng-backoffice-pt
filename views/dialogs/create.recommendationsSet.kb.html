<md-dialog aria-label="{{ 'Recommendation set' | translate }}" class="dialog-width">
    <form name="recommendationSetForm">
        <md-toolbar>
            <div class="md-toolbar-tools">
                <h2 ng-if="!recommendationSet.uuid" translate>Add a recommendation set</h2>
                <h2 ng-if="recommendationSet.uuid" translate>Edit recommendation set</h2>
                <span flex></span>
                <md-button class="md-icon-button" ng-click="cancel()">
                    <md-icon aria-label="{{ 'Close dialog' | translate }}">close</md-icon>
                </md-button>
            </div>
        </md-toolbar>

        <md-dialog-content>
            <div class="md-dialog-content">
                <md-input-container class="md-block">
                    <md-icon>toc</md-icon>
                    <label translate>Label</label>
                    <input type="text" ng-model="recommendationSet.label" ng-required="true" md-autofocus>
                </md-input-container>
            </div>
        </md-dialog-content>

        <md-dialog-actions layout="row" layout-align="end center">
            <md-button ng-click="cancel()">
                {{ 'Cancel' | translate }}
            </md-button>
            <md-button ng-click="create()" ng-disabled="recommendationSetForm.$invalid" type="submit" class="md-accent md-hue-3">
                {{ (recommendationSet.uuid ? 'Save' : 'Create') | translate }}
            </md-button>
        </md-dialog-actions>
    </form>
</md-dialog>
